name: Build and release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        env:
          QUOTANEST_TEST_STARTUP_DELAY: "1.2"
        run: ./scripts/test.sh
      - name: Build universal DMG
        run: ./scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaNest-universal
          path: dist/*
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' .build/QuotaNest.app/Contents/Info.plist)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "QuotaNest $VERSION" --notes-file RELEASE_NOTES.md
